<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141f">
    <meta
      name="description"
      content="A fast, offline-capable stopwatch and countdown app for timing multiple runners or experiments at once."
    >
    <title>StopTheTime</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=71">
    <script src="./app.js?v=71" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipLink">Skip to timers</a>

    <header class="app-header">
      <div class="brand-block">
        <h1>StopTheTime</h1>
      </div>

      <nav class="header-menu" aria-label="Timer menu">
        <button class="menu-link" type="button" data-menu-target="stopwatchPanel" aria-pressed="true" data-i18n="navStopwatch">Stopwatch</button>
        <button class="menu-link" type="button" data-menu-target="timerPanel" aria-pressed="false" data-i18n="navTimer">Timer</button>
      </nav>

      <div class="header-tools" aria-label="Application controls">
        <button id="liveClockBtn" class="live-clock" type="button" aria-label="Open full screen clock" data-i18n-aria="openClockFullscreen">
          <time id="liveClock" datetime="">--:--:-- --:--:----</time>
        </button>

        <button id="newSessionBtn" class="button button-secondary" type="button" data-i18n="newSession">
          New Session
        </button>

        <div class="preference-stack">
          <div id="languageSwitcher" class="preference-switcher language-switcher" role="group" aria-label="Language" data-i18n-aria="language">
            <button class="switcher-btn language-option" type="button" data-language-value="nl" aria-label="Nederlands" title="Nederlands" aria-pressed="false">
              <span class="language-flag" aria-hidden="true">
                <svg viewBox="0 0 9 6" width="30" height="20" focusable="false"><path fill="#ae1c28" d="M0 0h9v2H0z"></path><path fill="#fff" d="M0 2h9v2H0z"></path><path fill="#21468b" d="M0 4h9v2H0z"></path></svg>
              </span>
            </button>
            <button class="switcher-btn language-option" type="button" data-language-value="en" aria-label="English" title="English" aria-pressed="true">
              <span class="language-flag" aria-hidden="true">
                <svg viewBox="0 0 60 30" width="30" height="15" focusable="false"><defs><clipPath id="languageFlagClipGb"><path d="M0 0h60v30H0z"></path></clipPath></defs><path fill="#012169" d="M0 0h60v30H0z"></path><path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30" clip-path="url(#languageFlagClipGb)"></path><path stroke="#c8102e" stroke-width="4" d="M0 0l60 30M60 0L0 30" clip-path="url(#languageFlagClipGb)"></path><path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60" clip-path="url(#languageFlagClipGb)"></path><path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60" clip-path="url(#languageFlagClipGb)"></path></svg>
              </span>
            </button>
            <button class="switcher-btn language-option" type="button" data-language-value="de" aria-label="Deutsch" title="Deutsch" aria-pressed="false">
              <span class="language-flag" aria-hidden="true">
                <svg viewBox="0 0 5 3" width="30" height="18" focusable="false"><path fill="#000" d="M0 0h5v1H0z"></path><path fill="#d00" d="M0 1h5v1H0z"></path><path fill="#ffce00" d="M0 2h5v1H0z"></path></svg>
              </span>
            </button>
          </div>

          <div id="themeSwitcher" class="preference-switcher theme-switcher" role="group" aria-label="Appearance" data-i18n-aria="appearance">
            <button class="switcher-btn theme-option" type="button" data-theme-value="light" aria-label="Light mode" title="Light mode" aria-pressed="false">
              <span class="theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span>
            </button>
            <button class="switcher-btn theme-option" type="button" data-theme-value="auto" aria-label="Match system" title="Match system" aria-pressed="true">
              <span class="theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span>
            </button>
            <button class="switcher-btn theme-option" type="button" data-theme-value="dark" aria-label="Dark mode" title="Dark mode" aria-pressed="false">
              <span class="theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="app-shell">
      <section id="stopwatchPanel" class="workspace-section" aria-labelledby="stopwatchHeading">
        <div class="section-heading">
          <div>
            <h2 id="stopwatchHeading" data-i18n="stopwatchHeading">Stopwatches</h2>
          </div>
          <p id="sessionMeta" class="session-meta">Session ready</p>
        </div>

        <div class="global-actions" role="group" aria-label="Global stopwatch controls" data-i18n-aria="globalStopwatchControls">
          <button id="startAllBtn" class="button button-primary" type="button" data-i18n="startAll">START ALL</button>
          <button id="stopAllBtn" class="button button-danger" type="button" data-i18n="stopAll">STOP ALL</button>
          <button id="lapAllBtn" class="button button-secondary" type="button" data-i18n="lapAll">LAP ALL</button>
          <button id="resetAllBtn" class="button button-secondary" type="button" data-i18n="resetAll">RESET ALL</button>
          <button id="addStopwatchBtn" class="button button-quiet" type="button" data-i18n="addStopwatch">+ Stopwatch</button>
        </div>

        <div class="shortcut-strip" aria-label="Keyboard shortcuts">
          <span><kbd>Space</kbd> <span data-i18n="spaceShortcut">Start / Stop All</span></span>
          <span><kbd>L</kbd> <span data-i18n="lapShortcut">Lap All</span></span>
          <p id="shortcutMessage" class="inline-message" role="status" aria-live="polite"></p>
        </div>

        <div id="stopwatchList" class="stopwatch-list" aria-live="polite"></div>
      </section>

      <section id="timerPanel" class="workspace-section countdown-section" aria-labelledby="countdownHeading" hidden>
        <div class="section-heading">
          <div>
            <h2 id="countdownHeading" data-i18n="countdownHeading">Timers</h2>
          </div>
          <div class="timer-heading-status">
            <p id="countdownMeta" class="session-meta">1 timer - 0 running</p>
            <output id="countdownStatus" class="status-pill" aria-live="polite">Idle</output>
          </div>
        </div>

        <div class="timer-global-actions" role="group" aria-label="Global timer controls" data-i18n-aria="globalTimerControls">
          <button id="startAllTimersBtn" class="button button-primary" type="button" data-i18n="startAllTimers">START ALL TIMERS</button>
          <button id="pauseAllTimersBtn" class="button button-secondary" type="button" data-i18n="pauseAllTimers">PAUSE ALL TIMERS</button>
          <button id="stopAllTimersBtn" class="button button-danger" type="button" data-i18n="stopAllTimers">STOP ALL TIMERS</button>
          <button id="addTimerBtn" class="button button-quiet" type="button" data-i18n="addTimer">+ Timer</button>
        </div>

        <div id="countdownList" class="countdown-list" aria-live="polite"></div>

        <div class="sound-row">
          <label class="field volume-field">
            <span><span data-i18n="overallVolumeLabel">Overall volume</span> <output id="volumeValue">100%</output></span>
            <input id="volumeInput" type="range" min="0" max="100" step="1">
          </label>
        </div>
      </section>

      <section class="workspace-section export-section" aria-labelledby="exportHeading">
        <div class="section-heading">
          <div>
            <h2 id="exportHeading" data-i18n="sessionLogHeading">Session Log</h2>
          </div>
          <div class="section-actions">
            <button id="resetEventLogBtn" class="button button-secondary" type="button" data-i18n="resetEventLog">
              Reset event log
            </button>
            <button id="exportCsvBtn" class="button button-primary" type="button" data-i18n="exportCsv">
              Export Event Log as CSV
            </button>
          </div>
        </div>

        <p id="eventCount" class="session-meta">0 events recorded</p>
        <div class="event-table-wrap">
          <table class="event-table">
            <caption data-i18n="recentEventLog">Recent event log</caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="tableTime">Time</th>
                <th scope="col" data-i18n="tableTimer">Timer</th>
                <th scope="col" data-i18n="tableEvent">Event</th>
                <th scope="col" data-i18n="tableElapsed">Elapsed</th>
                <th scope="col" data-i18n="tableLap">Lap</th>
              </tr>
            </thead>
            <tbody id="eventRows">
              <tr>
                <td colspan="5" data-i18n="noEvents">No events yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="fullscreenCountdown" class="fullscreen-countdown" role="dialog" aria-modal="true" aria-labelledby="fullscreenCountdownName" hidden>
      <button id="exitFullscreenBtn" class="button button-secondary fullscreen-exit" type="button" aria-label="Exit fullscreen countdown" data-i18n-aria="exitFullscreen" data-i18n="exit">
        Exit
      </button>
      <div class="fullscreen-content">
        <p id="fullscreenCountdownName" class="fullscreen-name">EXPERIMENT</p>
        <output id="fullscreenCountdownDisplay" class="fullscreen-time">00:05</output>
        <div class="fullscreen-controls" role="group" aria-label="Fullscreen timer controls" data-i18n-aria="fullscreenTimerControls">
          <button id="fullscreenToggleBtn" class="button button-primary" type="button" data-i18n="start">START</button>
          <button id="fullscreenResetBtn" class="button button-danger" type="button" data-i18n="stop">STOP</button>
        </div>
        <div class="fullscreen-progress" aria-hidden="true">
          <span id="fullscreenProgressBar"></span>
        </div>
      </div>
    </div>

    <div id="fullscreenClock" class="fullscreen-clock" role="dialog" aria-modal="true" aria-labelledby="fullscreenClockTime" hidden>
      <button id="exitClockFullscreenBtn" class="button button-secondary fullscreen-exit" type="button" aria-label="Exit full screen clock" data-i18n-aria="exitClockFullscreen" data-i18n="exit">
        Exit
      </button>
      <div class="fullscreen-clock-content">
        <time id="fullscreenClockTime" class="fullscreen-clock-time" datetime="">--:--:--</time>
        <p id="fullscreenClockDate" class="fullscreen-clock-date">-- --- ----</p>
      </div>
    </div>

    <footer id="app-footer" class="app-footer" role="contentinfo" aria-label="App version and credits">
      <span aria-hidden="true">v</span><span class="app-footer-version">1.2.15</span>
      <span class="app-footer-sep" aria-hidden="true">·</span>
      <a class="app-footer-link" href="./LICENSE" title="GNU General Public License version 3">GPL v3</a>
      <span class="app-footer-sep" aria-hidden="true">·</span>
      <span class="app-footer-by">by <a class="app-footer-link" href="https://github.com/P7uis" target="_blank" rel="noopener noreferrer">P7uis</a></span>
    </footer>
  </body>
</html>
